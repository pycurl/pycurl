name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build-only: just build; testpypi: publish to TestPyPI; release: draft a GitHub release, then publish to PyPI and GitHub on approval'
        type: choice
        options:
          - build-only
          - testpypi
          - release
        required: true
        default: build-only

concurrency:
  group: ${{ inputs.mode == 'release' && 'release' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate version and draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check version numbers
        id: version
        run: echo "version=$(scripts/release-notes --version)" >> "$GITHUB_OUTPUT"
      - name: Generate release notes
        run: |
          scripts/release-notes > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check that the release does not exist yet
        if: inputs.mode == 'release'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Tag $TAG already exists"
            exit 1
          fi
          # Drafts can share a tag name, so look for them explicitly.
          if gh api "repos/$GH_REPO/releases" --paginate --jq ".[].tag_name" | grep -qx "$TAG"; then
            echo "A release for $TAG already exists"
            exit 1
          fi
      - name: Create draft release
        if: inputs.mode == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "PycURL $VERSION" \
            --notes-file notes.md

  build-sdist:
    name: Build sdist
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install libcurl (for curl-config)
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-gnutls-dev
      - name: Install build frontend
        run: python -m pip install --upgrade build
      - name: Build sdist
        run: python -m build --sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          path: dist/pycurl-*.tar.gz
          name: sdist

  package-wheel:
    name: Build wheels on ${{ matrix.os }} ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
          - os: macos-15
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - uses: step-security/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}

      - name: Install packages (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install curl[brotli,core,http2,non-http,psl,ssh,ssl,websockets]:${{ matrix.arch }}-windows

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch == 'arm64' && 'ARM64' || 'AMD64' }}
          CIBW_ENVIRONMENT_WINDOWS: PYCURL_CURL_DIR=C:/vcpkg/packages/curl_${{ matrix.arch }}-windows PYCURL_SSL_LIBRARY=schannel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --add-path C:/vcpkg/installed/${{ matrix.arch }}-windows/bin -w {dest_dir} {wheel}
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}

  docs:
    name: Build docs
    needs: prepare
    if: inputs.mode == 'release'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      packages: write

  upload-docs:
    name: Upload docs to draft release
    needs: [prepare, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download docs
        uses: actions/download-artifact@v8
        with:
          pattern: pycurl-*-docs.tar.gz
          path: docs/
          merge-multiple: true
      - name: Upload docs to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v$VERSION" "docs/pycurl-$VERSION-docs.tar.gz"

  # The pypi environment requires approval; this is where a release waits to be
  # reviewed. PyPI goes first because an upload there cannot be undone, whereas
  # the GitHub release is still a draft if this fails.
  publish-pypi:
    name: Publish to ${{ inputs.mode == 'release' && 'PyPI' || 'TestPyPI' }}
    needs: [build-sdist, package-wheel, upload-docs]
    if: ${{ !cancelled() && !failure() && inputs.mode != 'build-only' }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.mode == 'release' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.mode == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  publish-release:
    name: Publish GitHub release
    needs: [prepare, publish-pypi]
    if: inputs.mode == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Publishing the draft creates the tag at the commit this run built.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false

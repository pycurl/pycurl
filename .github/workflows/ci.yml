name: CI-Linux

on:
  push:
    branches: [ master ]
    paths-ignore:
    - '.github/workflows/ci-macos.yml'
    - '.github/workflows/ci-windows.yml'
    - '.github/workflows/cibuildwheel.yml'
    - '.github/workflows/docs.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
    - '.github/workflows/ci-macos.yml'
    - '.github/workflows/ci-windows.yml'
    - '.github/workflows/cibuildwheel.yml'
    - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-24.04
    env:
      VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,${{ github.event_name == 'pull_request' && 'read' || 'readwrite' }}"
    strategy:
      fail-fast: false
      matrix:
        curl-version: ["ubuntu"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15"]
        include:
          - curl-version: "vcpkg"
            python-version: "3.12"
            cibw-build: "cp312-manylinux_x86_64"
          - curl-version: "vcpkg"
            python-version: "3.14t"
            cibw-build: "cp314t-manylinux_x86_64"
          - curl-version: "ubuntu"
            python-version: "3.12d"
            use-debug-python: true
    permissions:
      packages: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      if: ${{ !matrix.use-debug-python }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install libcurl4-gnutls-dev libgnutls28-dev
      if: matrix.curl-version == 'ubuntu'
    - name: Set up Debug Python ${{ matrix.python-version }}
      if: ${{ matrix.use-debug-python }}
      run: |
        sudo apt-get install python3-dbg gdb
        sudo rm /usr/bin/python
        sudo ln -s /usr/bin/python3.12d /usr/bin/python
        sudo sysctl -w kernel.core_pattern=core
    - name: Install dependencies
      if: matrix.curl-version == 'ubuntu'
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        sudo apt-get install vsftpd
    - name: Lint with flake8
      if: matrix.curl-version == 'ubuntu'
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    - name: Build
      if: matrix.curl-version == 'ubuntu'
      env:
        CFLAGS: -Werror
      run: python -m pip install . --group dev -v
    - name: Verify free-threaded import does not enable the GIL
      if: matrix.python-version == '3.14t' && matrix.curl-version == 'ubuntu'
      env:
        PYTHON_GIL: "0"
      run: |
        python -W error -c "import pycurl; print(pycurl.version)"
        python -c "import sys, pycurl; assert sys._is_gil_enabled() is False, 'pycurl import re-enabled the GIL'"
    - name: Test with pytest
      if: matrix.curl-version == 'ubuntu'
      env:
        PYCURL_VSFTPD_PATH: vsftpd
        PYTEST_ADDOPTS: ${{ matrix.use-debug-python && '-s' || '' }}
      run: |
        ulimit -c unlimited
        make do-test
    - name: Show gdb backtrace on crash
      if: ${{ failure() && matrix.use-debug-python }}
      run: |
        if [ -f core ]; then
          gdb -batch -ex "thread apply all bt full" -ex "py-bt" "$(which python)" core
        else
          echo "Test step failed but no core file was found."
        fi
    - name: Build & test with cibuildwheel
      if: matrix.curl-version == 'vcpkg'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CIBW_ENVIRONMENT_PASS_LINUX: GITHUB_TOKEN GITHUB_REPOSITORY_OWNER VCPKG_BINARY_SOURCES PYCURL_WERROR
        PYCURL_WERROR: "1"
      run: |
        pip install cibuildwheel
        cibuildwheel --only ${{ matrix.cibw-build }}
